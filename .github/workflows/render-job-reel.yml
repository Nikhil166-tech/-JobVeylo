name: Render queued JobVeylo reel
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: read
concurrency:
  group: jobveylo-reel-renderer
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      JOBVEYLO_AUTOMATION_KEY: ${{ secrets.JOBVEYLO_AUTOMATION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media dependencies
        if: env.JOBVEYLO_AUTOMATION_KEY != ''
        run: python -m pip install Pillow==12.0.0 imageio-ffmpeg==0.6.0
      - name: Render one queued job
        if: env.JOBVEYLO_AUTOMATION_KEY != ''
        run: python scripts/render-queued-reel.py
